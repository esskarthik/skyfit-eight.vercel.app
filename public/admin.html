<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYFIT ZONE — Admin</title>
<link rel="icon" href="assets/logo-new-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="login-brand"><img src="assets/logo-new-icon.png" alt="">SKYFIT <em>ZONE</em></div>
    <h1>Admin Access</h1>
    <p>Sign in with your staff credentials to manage the gym.</p>
    <label class="label">Email</label>
    <input id="loginEmail" class="input" type="email" placeholder="admin@skyfit.com" autocomplete="username">
    <label class="label">Password</label>
    <div class="pwd-wrap">
      <input id="loginPwd" class="input" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="button" class="pwd-toggle" id="pwdToggle" onclick="togglePwd()" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">Unlock admin <i class="fa-solid fa-arrow-right"></i></button>
    <p id="loginErr" class="login-err" style="display:none"></p>
  </div>
</div>

<!-- APP SHELL -->
<div id="appView" class="app" style="display:none">
  <div class="side-backdrop" id="sideBackdrop" onclick="toggleSidebar(false)" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><img src="assets/logo-new-icon.png" alt="">SKYFIT <em>ZONE</em> <span>ADMIN</span></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="side-user" onclick="location.hash='#/settings'">
        <span class="side-avatar" id="sideAvatar">A</span>
        <span class="side-uname" id="sideName">Admin</span>
        <span class="side-urole" id="sideRole">ADMIN</span>
      </button>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      <button class="btn btn-ghost btn-sm" onclick="window.open('/','_blank')"><i class="fa-solid fa-globe"></i> View site</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-sm hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="location.hash='#/notifications'" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="dot" id="notifDot" style="display:none"></span></button>
        <span class="topbar-user" id="topbarUser">Admin</span>
      </div>
    </header>
    <main class="content" id="content"><div class="loading">Loading…</div></main>
  </div>
</div>

<!-- GENERIC MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal"></div>
</div>

<!-- CONFIRM DIALOG -->
<div class="modal-overlay" id="confirmOverlay" onclick="if(event.target===this) closeConfirm()">
  <div class="modal confirm">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmMsg" class="muted"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmOk" onclick="confirmOk()">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="admin.js"></script>
</body>
</html>
